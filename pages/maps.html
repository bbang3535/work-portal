<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BBITT LAB · 주소 지도 표시</title>

  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JAVASCRIPT_KEY&libraries=services"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", "Pretendard", Arial, sans-serif; }
    body { min-height: 100vh; background: #eef3fb; color: #111827; }
    .page { padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .brand { font-size: 24px; font-weight: 900; }
    .brand span { color: #2563eb; }
    .back { text-decoration: none; background: #111827; color: white; padding: 10px 16px; border-radius: 14px; font-weight: 700; }

    .hero { background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; border-radius: 28px; padding: 32px; margin-bottom: 22px; box-shadow: 0 20px 50px rgba(37,99,235,.22); }
    .hero h1 { font-size: 34px; margin-bottom: 10px; }
    .hero p { color: #dbeafe; line-height: 1.6; }

    .input-panel, .map-card, .list-card, .roadview-card {
      background: white; border-radius: 26px; padding: 20px; box-shadow: 0 12px 35px rgba(15,23,42,.08);
    }
    .input-panel { margin-bottom: 22px; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    label { display: block; font-weight: 800; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid #dbe3ef; border-radius: 18px; padding: 16px; font-size: 15px; line-height: 1.6; outline: none; }
    textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.12); }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
    button { border: none; border-radius: 14px; padding: 12px 18px; font-weight: 800; cursor: pointer; }
    .primary { background: #2563eb; color: white; }
    .route { background: #ef4444; color: white; }
    .secondary { background: #eef3fb; color: #1e293b; }
    .hint { color: #64748b; font-size: 14px; }

    .map-layout { display: grid; grid-template-columns: 1.4fr .9fr; gap: 18px; }
    #map { width: 100%; height: 560px; border-radius: 20px; overflow: hidden; }
    .list-card h2, .roadview-card h2 { font-size: 20px; margin-bottom: 14px; }
    .count { color: #2563eb; font-weight: 900; }

    .place-list { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; }
    .place-item { border: 1px solid #e5eaf3; border-radius: 18px; padding: 14px; cursor: pointer; transition: .2s; background: #f8fafc; }
    .place-item:hover { background: #eff6ff; border-color: #93c5fd; transform: translateY(-2px); }
    .place-title { font-weight: 900; margin-bottom: 5px; }
    .place-info { color: #64748b; font-size: 13px; line-height: 1.5; }
    .badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 999px; background: #ef4444; color: white; font-size: 13px; font-weight: 900; margin-right: 8px; }

    .roadview-card { margin-top: 18px; }
    #roadview { width: 100%; height: 380px; border-radius: 20px; background: #f1f5f9; overflow: hidden; }
    .empty { padding: 30px; color: #64748b; text-align: center; background: #f8fafc; border-radius: 18px; line-height: 1.6; }
    .error { color: #ef4444; font-size: 13px; margin-top: 10px; }
    .ok { color: #2563eb; font-size: 13px; margin-top: 10px; font-weight: 700; }

    @media (max-width: 1100px) {
      .input-grid, .map-layout { grid-template-columns: 1fr; }
      #map { height: 460px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="header">
      <div class="brand">BBITT <span>LAB</span></div>
      <a class="back" href="../index.html">← 홈으로</a>
    </header>

    <section class="hero">
      <h1>주소 지도 표시</h1>
      <p>주소를 엔터 또는 쉼표(,)로 입력하면 번호 마커를 표시합니다.<br>여러 현장을 방문할 때 직선거리 기준 최적 경로도 추출할 수 있습니다.</p>
    </section>

    <section class="input-panel">
      <div class="input-grid">
        <div>
          <label for="addressInput">주소</label>
          <textarea id="addressInput" placeholder="예)
서울특별시 중구 세종대로 110
서울특별시 강서구 공항대로 411, 서울특별시 영등포구 당산로 123"></textarea>
        </div>

        <div>
          <label for="memoInput">추가 정보</label>
          <textarea id="memoInput" placeholder="예)
서울시청 인근 작업지
강서구청 인근 작업지
영등포구청 인근 작업지"></textarea>
        </div>
      </div>

      <div class="buttons">
        <button class="primary" onclick="showAddresses()">지도에 표시</button>
        <button class="route" onclick="makeOptimizedRoute()">최적의 경로 추출</button>
        <button class="secondary" onclick="resetMap()">초기화</button>
        <span class="hint">주소는 엔터 또는 쉼표(,)로 구분됩니다.</span>
      </div>

      <div id="message"></div>
    </section>

    <section class="map-layout">
      <div class="map-card">
        <div id="map"></div>
      </div>

      <aside class="list-card">
        <h2>위치 목록 <span class="count" id="count">0</span></h2>
        <div id="placeList" class="place-list">
          <div class="empty">주소를 입력하고 지도에 표시를 눌러주세요.</div>
        </div>
      </aside>
    </section>

    <section class="roadview-card">
      <h2>로드뷰</h2>
      <div id="roadview"></div>
    </section>
  </div>

  <script>
    let map, geocoder, bounds, roadview, roadviewClient;
    let markers = [];
    let places = [];
    let routeLine = null;

    window.onload = function () {
      map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 8
      });

      geocoder = new kakao.maps.services.Geocoder();
      bounds = new kakao.maps.LatLngBounds();
      roadview = new kakao.maps.Roadview(document.getElementById("roadview"));
      roadviewClient = new kakao.maps.RoadviewClient();
    };

    function getItems(id) {
      return document.getElementById(id).value
        .split(/[\n,]+/)
        .map(v => v.trim())
        .filter(v => v.length > 0);
    }

    function showMessage(text, type = "ok") {
      const msg = document.getElementById("message");
      msg.className = type;
      msg.textContent = text;
    }

    function clearAll() {
      markers.forEach(marker => marker.setMap(null));
      markers = [];
      places = [];
      bounds = new kakao.maps.LatLngBounds();

      if (routeLine) {
        routeLine.setMap(null);
        routeLine = null;
      }
    }

    function resetMap() {
      clearAll();
      document.getElementById("addressInput").value = "";
      document.getElementById("memoInput").value = "";
      document.getElementById("count").textContent = "0";
      document.getElementById("placeList").innerHTML = '<div class="empty">주소를 입력하고 지도에 표시를 눌러주세요.</div>';
      showMessage("");
      map.setCenter(new kakao.maps.LatLng(37.5665, 126.9780));
      map.setLevel(8);
    }

    function showAddresses() {
      clearAll();

      const addresses = getItems("addressInput");
      const memos = getItems("memoInput");

      if (addresses.length === 0) {
        showMessage("주소를 1개 이상 입력해주세요.", "error");
        return;
      }

      document.getElementById("placeList").innerHTML = "";
      document.getElementById("count").textContent = "0";
      showMessage("주소를 검색하고 있습니다...");

      let completed = 0;
      let successCount = 0;

      addresses.forEach((address, index) => {
        geocoder.addressSearch(address, function (result, status) {
          completed++;

          if (status === kakao.maps.services.Status.OK) {
            const lat = result[0].y;
            const lng = result[0].x;
            const coords = new kakao.maps.LatLng(lat, lng);
            const memo = memos[index] || "";

            const place = { index: index + 1, address, memo, coords, lat, lng };

            places.push(place);
            bounds.extend(coords);

            const marker = createRedArrowMarker(coords, index + 1);
            markers.push(marker);

            kakao.maps.event.addListener(marker, "click", function () {
              focusPlace(place);
            });

            successCount++;
          } else {
            addFailItem(index + 1, address);
          }

          if (completed === addresses.length) {
            if (successCount > 0) {
              places.sort((a, b) => a.index - b.index);
              renderPlaceList(places);
              map.setBounds(bounds);
              document.getElementById("count").textContent = successCount;
              showMessage(`${successCount}개 위치를 지도에 표시했습니다.`);
              focusPlace(places[0]);
            } else {
              showMessage("검색된 주소가 없습니다. 주소를 다시 확인해주세요.", "error");
            }
          }
        });
      });
    }

    function createRedArrowMarker(position, number) {
      const content = `
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;transform:translateY(-8px);">
          <div style="
            min-width:34px;height:34px;padding:0 9px;border-radius:999px;
            background:#ef4444;color:white;display:flex;align-items:center;justify-content:center;
            font-weight:900;font-size:14px;border:3px solid white;
            box-shadow:0 6px 16px rgba(0,0,0,.28);">
            ${number}
          </div>
          <div style="
            width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;
            border-top:14px solid #ef4444;filter:drop-shadow(0 4px 3px rgba(0,0,0,.22));">
          </div>
        </div>
      `;

      const marker = new kakao.maps.CustomOverlay({
        position,
        content,
        yAnchor: 1
      });

      marker.setMap(map);
      return marker;
    }

    function renderPlaceList(list, isRoute = false) {
      const placeList = document.getElementById("placeList");
      placeList.innerHTML = "";

      list.forEach((place, idx) => {
        const item = document.createElement("div");
        item.className = "place-item";

        item.innerHTML = `
          <div class="place-title">
            <span class="badge">${isRoute ? idx + 1 : place.index}</span>
            ${isRoute ? "방문 " + (idx + 1) + " · " : ""}${place.address}
          </div>
          <div class="place-info">
            ${place.memo ? place.memo + "<br>" : ""}
            위도 ${Number(place.lat).toFixed(6)} · 경도 ${Number(place.lng).toFixed(6)}
          </div>
        `;

        item.onclick = function () {
          focusPlace(place);
        };

        placeList.appendChild(item);
      });
    }

    function addFailItem(index, address) {
      const list = document.getElementById("placeList");
      const item = document.createElement("div");
      item.className = "place-item";
      item.innerHTML = `
        <div class="place-title">
          <span class="badge">${index}</span>${address}
        </div>
        <div class="place-info">주소를 찾지 못했습니다.</div>
      `;
      list.appendChild(item);
    }

    function focusPlace(place) {
      map.panTo(place.coords);
      map.setLevel(4);

      roadviewClient.getNearestPanoId(place.coords, 80, function (panoId) {
        if (panoId) {
          roadview.setPanoId(panoId, place.coords);
        } else {
          document.getElementById("roadview").innerHTML =
            '<div class="empty">해당 위치 주변의 로드뷰를 찾지 못했습니다.</div>';
        }
      });
    }

    function makeOptimizedRoute() {
      if (places.length < 2) {
        showMessage("최적 경로를 만들려면 주소가 2개 이상 필요합니다.", "error");
        return;
      }

      const route = nearestNeighborRoute(places);
      drawRoute(route);
      renderPlaceList(route, true);

      const totalKm = getTotalDistance(route).toFixed(2);
      showMessage(`직선거리 기준 최적 방문 순서를 추출했습니다. 총 예상 직선거리: ${totalKm}km`);
    }

    function nearestNeighborRoute(inputPlaces) {
      const remaining = [...inputPlaces];
      const route = [];

      let current = remaining.shift();
      route.push(current);

      while (remaining.length > 0) {
        let nearestIndex = 0;
        let nearestDistance = getDistance(current, remaining[0]);

        for (let i = 1; i < remaining.length; i++) {
          const distance = getDistance(current, remaining[i]);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestIndex = i;
          }
        }

        current = remaining.splice(nearestIndex, 1)[0];
        route.push(current);
      }

      return route;
    }

    function drawRoute(route) {
      if (routeLine) routeLine.setMap(null);

      const path = route.map(place => place.coords);

      routeLine = new kakao.maps.Polyline({
        path,
        strokeWeight: 5,
        strokeColor: "#ef4444",
        strokeOpacity: 0.85,
        strokeStyle: "solid"
      });

      routeLine.setMap(map);

      const routeBounds = new kakao.maps.LatLngBounds();
      route.forEach(place => routeBounds.extend(place.coords));
      map.setBounds(routeBounds);
    }

    function getTotalDistance(route) {
      let total = 0;
      for (let i = 0; i < route.length - 1; i++) {
        total += getDistance(route[i], route[i + 1]);
      }
      return total;
    }

    function getDistance(a, b) {
      const R = 6371;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);

      const x =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.sin(dLng / 2) * Math.sin(dLng / 2) *
        Math.cos(lat1) * Math.cos(lat2);

      const c = 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
      return R * c;
    }

    function toRad(value) {
      return value * Math.PI / 180;
    }
  </script>
</body>
</html>
